<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>牢杜の画板</title>
<link rel="stylesheet" href="styles.css?v=14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🎨</span>
      <span class="brand-text">画画网站</span>
    </div>

    <div class="actions">
      <button class="btn" id="undoBtn" title="撤回 (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        <span>撤回</span>
      </button>
      <button class="btn" id="redoBtn" title="重做 (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        <span>重做</span>
      </button>
      <button class="btn" id="clearBtn" title="清空画布">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
        <span>清空</span>
      </button>
      <button class="btn btn-primary" id="saveBtn" data-action="save" title="保存为透明背景 PNG (Ctrl+S)">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span>保存</span>
      </button>
    </div>
  </header>

  <main class="workspace">

    <aside class="panel">

      <section class="group">
        <h2 class="group-title">工具</h2>
        <div class="tools">
          <button class="tool" data-tool="brush" title="涂鸦笔 (B)">
            <svg viewBox="0 0 24 24"><path d="M4 20c3 0 4-2 4-4s-2-3-3-3-3 1-3 1 0 6 2 6Z"/><path d="M9.5 14.5 20 4l-1.5-1.5L8 13"/></svg>
            <span>涂鸦笔</span>
          </button>
          <button class="tool" data-tool="eraser" title="橡皮擦 (E)">
            <svg viewBox="0 0 24 24"><path d="m14 4 6 6-9 9H6l-2-2 10-13Z"/><path d="m9 9 6 6"/><path d="M11 19h9"/></svg>
            <span>橡皮擦</span>
          </button>
          <button class="tool" data-tool="fill" title="填色桶 (G)">
            <svg viewBox="0 0 24 24"><path d="M5 11 12 4l7 7-7 7-7-7Z"/><path d="M9 7 7 5"/><path d="M19 15c1.5 2 2 3 2 4a2 2 0 1 1-4 0c0-1 .5-2 2-4Z"/></svg>
            <span>填色桶</span>
          </button>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title">
          颜色
          <span class="color-preview" id="colorPreview"></span>
        </h2>
        <div class="swatches" id="swatches"></div>
        <label class="custom-color">
          <span>自定义颜色</span>
          <input type="color" id="colorPicker" value="#111827">
        </label>
      </section>

      <section class="group" id="sizeGroup">
        <h2 class="group-title">笔触粗细 <span class="value" id="sizeValue">10</span></h2>
        <input type="range" id="sizeSlider" min="1" max="120" value="10" step="1">
      </section>

      <section class="group" id="tolGroup">
        <h2 class="group-title">填色容差 <span class="value" id="tolValue">32</span></h2>
        <input type="range" id="tolSlider" min="0" max="120" value="32" step="1">
        <p class="hint">容差越大，越容易越过线条边缘填色。</p>
      </section>

      <section class="group">
        <h2 class="group-title">快捷键</h2>
        <ul class="keys">
          <li><kbd>B</kbd> 涂鸦笔</li>
          <li><kbd>E</kbd> 橡皮擦</li>
          <li><kbd>G</kbd> 填色桶</li>
          <li><kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤回</li>
          <li><kbd>Ctrl</kbd>+<kbd>Y</kbd> 重做</li>
          <li><kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</li>
        </ul>
      </section>

      <section class="group">
        <button class="btn btn-primary btn-block" data-action="save" title="保存为透明背景 PNG (Ctrl+S)">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>保存为透明 PNG</span>
        </button>
      </section>

    </aside>

    <section class="stage">
      <div class="board-wrap">
        <canvas id="board"></canvas>
      </div>

      <button class="appraise-btn" id="appraiseBtn" type="button" title="让 AI 鉴定这幅画">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20.5 20.5-4-4"/>
        </svg>
        <span>鉴定</span>
      </button>

      <section class="appraise-card" id="appraiseCard" hidden aria-live="polite">
        <header class="appraise-head">
          <span class="appraise-title">鉴定报告</span>
          <span class="appraise-tools">
            <button class="appraise-icon-btn" id="appraiseSettings" type="button" title="换个模型 / 设置 API Key" aria-label="设置模型">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
              </svg>
            </button>
            <button class="appraise-icon-btn appraise-close" id="appraiseClose" type="button" aria-label="关闭">×</button>
          </span>
        </header>
        <div class="appraise-body" id="appraiseBody"></div>
      </section>

      <div class="brush-cursor" id="brushCursor"></div>
    </section>

  </main>

</div>

<div class="modal" id="keyModal" hidden>
  <div class="modal-card">
    <h2>选择 AI 模型</h2>
    <p id="modalDesc">密钥只保存在你自己的浏览器里（localStorage），不会上传到别处，也不会写进这个网站的文件。</p>

    <label class="field">
      <span class="field-label">用哪家的模型</span>
      <select id="providerSelect"></select>
    </label>

    <label class="field" id="keyField">
      <span class="field-label">API Key</span>
      <input type="password" id="keyInput" placeholder="sk-..." autocomplete="off" spellcheck="false">
    </label>

    <label class="field">
      <span class="field-label">模型名</span>
      <input type="text" id="modelInput" autocomplete="off" spellcheck="false">
    </label>

    <p class="modal-hint" id="modalHint"></p>

    <div class="modal-actions">
      <button class="btn" id="keyClear" type="button" hidden>清除已保存的密钥</button>
      <span class="modal-spacer"></span>
      <button class="btn" id="keyCancel" type="button">取消</button>
      <button class="btn btn-primary" id="keySave" type="button">保存并鉴定</button>
    </div>
  </div>
</div>

<script src="script.js?v=14"></script>
</body>
</html>
